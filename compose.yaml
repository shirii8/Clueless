services:
  db:
    image: postgres:16-alpine
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clueless}
      POSTGRES_USER: ${POSTGRES_USER:-clueless}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clueless-local-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clueless} -d ${POSTGRES_DB:-clueless}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: ./api
    platform: linux/amd64
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://clueless:clueless-local-only@db:5432/clueless}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_BASE: ${LLM_API_BASE:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-25}
      # Use LiteLLM's bundled price map: no outbound call except to the configured provider.
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      SEED_DIR: /data/seed
    volumes:
      - ./data/seed:/data/seed:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 60s
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    platform: linux/amd64
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3001}:3000"
    restart: unless-stopped

  adminer:
    image: adminer:4-standalone
    platform: linux/amd64
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  postgres-data:
